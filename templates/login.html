<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Kaori Coffee - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/kaori_logo.png') }}">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">
                <img src="{{ url_for('static', filename='images/kaori_logo.png') }}" alt="Kaori Coffee">
            </div>
            <h1>Masuk ke Akun Anda</h1>
            
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}
            
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label>Nama Pengguna</label>
                    <input type="text" name="username" placeholder="Masukkan username" required autofocus>
                </div>
                
                <div class="form-group">
                    <label>Kata Sandi</label>
                    <input type="password" name="password" id="password" placeholder="Masukkan password" required>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="showPassword" onclick="togglePassword()">
                    <label for="showPassword">Tampilkan kata sandi</label>
                </div>
                
                <button type="submit" class="btn btn-primary">MASUK</button>
            </form>
            
            <div class="divider">
                <span>ATAU</span>
            </div>
            
            <div class="register-link">
                <p>Belum memiliki akun?</p>
                <a href="{{ url_for('register') }}" class="btn btn-secondary">DAFTAR SEKARANG</a>
            </div>
            
            <div class="footer">
                © 2025 Kaori Coffee. All rights reserved.
            </div>
        </div>
    </div>
    
    <script>
        function togglePassword() {
            const password = document.getElementById('password');
            password.type = password.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>

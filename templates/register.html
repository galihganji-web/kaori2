<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Kaori Coffee - Registrasi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/kaori_logo.png') }}">
</head>
<body>
    <div class="container">
        <div class="register-box">
            <div class="logo">
                <img src="{{ url_for('static', filename='images/kaori_logo.png') }}" alt="Kaori Coffee">
            </div>
            <h1>Registrasi Pegawai Baru</h1>
            
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}
            
            {% if success %}
            <div class="alert alert-success">
                {{ success }}
                <br><br>
                <a href="{{ url_for('login') }}" class="btn btn-primary">Kembali ke Login</a>
            </div>
            {% else %}
            
            <form method="POST" action="{{ url_for('register') }}">
                <div class="form-group">
                    <label>Nama Lengkap *</label>
                    <input type="text" name="nama_panjang" placeholder="Masukkan Nama Lengkap" required>
                </div>
                
                <div class="form-group">
                    <label>Jabatan *</label>
                    <input type="text" jabatan="jabatan" placeholder="Masukkan Jabatan" required>
                </div>
                
                <div class="form-group">
                    <label>Outlet *</label>
                      <input type="text" outlet="lokasi_outlet" placeholder="Masukkan Lokasi Outlet" required>
                </div>
                
                <div class="form-group">
                    <label>Username *</label>
                    <input type="text" name="username" placeholder="Username Untuk Login" required>
                </div>
                
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" name="password" id="password" placeholder="Minimal 6 karakter" required>
                </div>
                
                <div class="form-group">
                    <label>Nomor WhatsApp *</label>
                    <input type="tel" name="nomor_wa" placeholder="contoh: 081234567890" required>
                    <small style="color: #666; font-size: 12px;">Format: 08xxxxxxxxxx (tanpa +62)</small>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="showPassword" onclick="togglePassword()">
                    <label for="showPassword">Tampilkan password</label>
                </div>
                
                <button type="submit" class="btn btn-primary">DAFTAR</button>
            </form>
            
            <div class="divider">
                <span>ATAU</span>
            </div>
            
            <div class="register-link">
                <p>Sudah punya akun?</p>
                <a href="{{ url_for('login') }}" class="btn btn-secondary">KEMBALI KE LOGIN</a>
            </div>
            
            {% endif %}
            
            <div class="footer">
                © 2025 Kaori Coffee. All rights reserved.
            </div>
        </div>
    </div>
    
    <script>
        function togglePassword() {
            const password = document.getElementById('password');
            password.type = password.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
